<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self';style-src 'self';script-src 'self';img-src 'self' data:;">
  <title>Codex Hub</title>
  <link rel="icon" type="image/png" href="app-icon.png">
  <link rel="stylesheet" href="browser.css">

</head>
<body>
  <header class="browser-toolbar">
    <div class="toolbar-main">
      <div class="nav-actions">
        <button id="backButton" class="icon-button" title="Lùi" disabled>←</button>
        <button id="forwardButton" class="icon-button" title="Tiến" disabled>→</button>
        <button id="reloadButton" class="icon-button" title="Làm mới">↻</button>
        <button id="homeButton" class="home-button"><span class="logo-mark">AI</span><b>ChatGPT</b></button>
      </div>
      <div class="page-state" id="pageState"><i></i><span>Đang chuẩn bị ChatGPT…</span></div>
      <div class="service-state">
        <span id="downloadState" class="download-state"></span>
        <button id="deviceState" class="device-state-button" title="Thiết bị hiện tại"><i></i><span id="deviceStateName">Thiết bị</span></button>
        <span id="mcpState"><i></i>MCP</span>
        <span id="tunnelState"><i></i>Tunnel</span>
        <span id="recoveryTunnelState" data-state="not_configured" title="Tunnel cứu hộ: Chưa cấu hình"><i></i>Cứu hộ</span>
        <span id="gitState" title="Git: chưa có dữ liệu"><i></i><span id="gitStateText">Git</span></span>
        <button id="panelToggleButton" class="manager-button" title="Hiện/ẩn bảng điều khiển điều phối bên cạnh ChatGPT">Bảng điều khiển</button>
        <button id="resetSessionButton" class="manager-button" title="Xóa session đăng nhập ChatGPT riêng của app và đăng nhập lại">Đăng nhập lại</button>
        <button id="managerButton" class="manager-button">Cài đặt</button>
      </div>
    </div>
    <div class="workspace-bar">
      <div class="workspace-label" id="workspaceLabel">
        <span>Workspace hiện tại</span><strong id="activeWorkspace">Chưa chọn</strong>
        <button id="workspaceHealthButton" class="workspace-health-button" type="button" aria-label="Xem trạng thái đồng bộ workspace" aria-expanded="false"><i></i></button>
        <div id="workspaceHealthPopover" class="workspace-health-popover" hidden>
          <b id="workspaceHealthName">Chưa chọn workspace</b>
          <code id="workspaceHealthPath">-</code>
          <div><span>Trạng thái</span><strong id="workspaceHealthState">Chờ kiểm tra</strong></div>
          <div><span>Kiểm tra gần nhất</span><strong id="workspaceHealthTime">-</strong></div>
        </div>
      </div>
      <div class="task-strip" id="taskStrip">
        <i></i><b id="taskTitle">Chưa có nhiệm vụ</b><small id="taskStep"></small>
        <span class="task-progress" aria-hidden="true"><span id="taskProgressBar"></span></span><span id="taskProgressText" class="task-progress-text"></span>
        <button id="pauseTask">Tạm dừng</button><button id="resumeTask">Tiếp tục</button><button id="stopTask">Dừng</button>
      </div>
      <div id="workspaceChips" class="workspace-chips"></div>
      <select id="workspaceSelect" class="workspace-select" aria-label="Tất cả workspace"><option value="">Tất cả workspace</option></select>
      <div id="switchState" class="switch-state"></div>
      <button id="addAuthorizedRootQuick" class="add-workspace secondary-action" title="Ủy quyền một thư mục bổ sung, không cần chuyển workspace chính">＋ Thư mục ủy quyền</button>
      <button id="addWorkspace" class="add-workspace">＋ Thêm workspace</button>
    </div>
  </header>
  <main class="loading-stage">
    <div class="loading-card"><div class="spinner"></div><h1>Đang mở ChatGPT</h1><p>Trang chat và quyền truy cập workspace cục bộ được cách ly an toàn.</p></div>
  </main>
  <script src="browser.js"></script>
</body>
</html>
