name: P4 Completion Probe

"on":
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  probe:
    if: github.event.issue.title == '[P4 Completion Probe]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Coding Tools MCP test dependencies
        run: python -m pip install -e "resources/coding-tools-mcp[dev]"
      - name: Focused P4 and HTTP-boundary regression
        working-directory: resources/coding-tools-mcp
        run: python -m pytest tests/test_exception_group_boundary.py tests/test_p4_population_window.py tests/test_solution_economics.py -q
      - name: Check module size
        run: python resources/coding-tools-mcp/scripts/check_module_size.py
      - name: Report committed P4 readiness
        run: python resources/coding-tools-mcp/scripts/report_p4_readiness.py --workspace . --limit 100 | tee p4-readiness.json
      - name: Upload readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p4-completion-probe-${{ github.sha }}
          path: p4-readiness.json
          if-no-files-found: warn
          retention-days: 3
