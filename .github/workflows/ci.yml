name: CI

"on":
  # CI only runs when a release is being prepared: trigger manually from the
  # Actions tab (Run workflow). Push/PR triggers are disabled to keep GitHub
  # Actions minutes at zero during ordinary development; local validation
  # (unittest discover + module-size check + cargo test) covers daily work.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify checkout identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # Canonical release proof must never reuse workspace test binaries
          # from another source revision. Cargo's registry/git caches remain
          # useful while target artifacts are rebuilt from this exact SHA.
          cache-targets: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: resources/coding-tools-mcp/pyproject.toml
      - name: Install Coding Tools MCP test dependencies
        run: python -m pip install -e "resources/coding-tools-mcp[dev]"
      - name: Check Coding Tools MCP module sizes
        run: python resources/coding-tools-mcp/scripts/check_module_size.py
      - name: Test Coding Tools MCP
        working-directory: resources/coding-tools-mcp
        run: python -m pytest tests
      # The control-plane node E2E fixtures require the root node_modules
      # (they resolve the electron executable path to drive the recovery
      # host), which the earlier steps never install. Scripts stay enabled
      # because electron's postinstall produces the path file they read.
      - name: Install root dependencies for control-plane E2E fixtures
        run: npm ci
      - name: Test Ubuntu control plane source
        working-directory: control-plane
        run: python -W error -B -m unittest discover -s tests -v
      - name: Test control-plane Recovery IPC observer
        working-directory: control-plane
        run: node --test tests/recovery_identity_observer.test.cjs
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build frontend assets
        run: npm --prefix frontend run build
      - name: Type-check frontend
        run: npm --prefix frontend run typecheck
      - name: Test frontend
        run: npm --prefix frontend test
      - name: Verify generated frontend build
        run: npm --prefix frontend run check:dist
      - name: Verify workspace boundaries
        run: |
          bash scripts/workspace_boundary_check.sh --self-test
          bash scripts/workspace_boundary_check.sh
      - name: Reset Rust build artifacts
        run: cargo clean
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        shell: bash
        run: |
          set +e
          cargo test --locked --workspace 2>&1 | tee cargo-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "### Rust workspace test failure"
              echo '```text'
              grep -E -A20 -B5 'FAILED|panicked at|failures:|error:' cargo-test.log | tail -n 250 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E 'FAILED|panicked at|failures:|error:' cargo-test.log | tail -n 50 | while IFS= read -r line; do
              safe=${line//'%'/'%25'}
              safe=${safe//$'\r'/'%0D'}
              echo "::error::$safe"
            done
            exit "$status"
          fi
      - name: Upload Rust workspace failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rust-workspace-test-log-${{ github.sha }}
          path: cargo-test.log
          if-no-files-found: ignore
          retention-days: 3

  test-windows:
    # Windows release gate: the crates that must run natively on Windows 11
    # (CLI, Runner, persistent-shell's fail-closed gate, process control,
    # agent config, and webcodex-workspace's portable project identity used
    # by the native semantic bridge), and the npm distribution checks. The
    # desktop runtime integration suite (npm test) lives in its own job
    # (test-windows-desktop): in this job the pytest step fails first under
    # runner load often enough that the desktop suite never ran, leaving
    # Node changes with no CI evidence at all. The full Windows artifact ->
    # npm install smoke lives in its own job (test-windows-smoke) on a fresh
    # checkout: the suite above dirties the worktree, while the smoke's
    # -RequireExactSource demands a clean one, so the two cannot share a
    # worktree. The Server and its Unix-only runtime stay Linux-only.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      # Archived .coding-tools report overlays contain paths that exceed
      # the legacy Windows MAX_PATH under the runner's work directory;
      # git must opt into long paths before checkout writes any file.
      - name: Allow long paths for checkout
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - name: Verify checkout identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # Do not reuse stale workspace test executables across revisions.
          cache-targets: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: resources/coding-tools-mcp/pyproject.toml
      - name: Install Coding Tools MCP test dependencies
        run: python -m pip install -e "resources/coding-tools-mcp[dev]"
      - name: Test Coding Tools MCP
        working-directory: resources/coding-tools-mcp
        run: python -m pytest tests
      - name: Test control-plane Recovery IPC observer
        working-directory: control-plane
        run: node --test tests/recovery_identity_observer.test.cjs
      - name: Install desktop dependencies
        run: npm ci
      - name: Verify production desktop dependencies
        run: npm run audit:prod -- --audit-level=high
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build frontend assets
        run: npm --prefix frontend run build
      - name: Reset Rust build artifacts
        run: cargo clean
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --locked -p webcodex-agent-config -p webcodex-process -p webcodex-persistent-shell -p webcodex-workspace -p webcodex-cli -p webcodex-runner
      - name: Test npm installer and release manifest natively
        run: npm --prefix npm/webcodex test

  test-windows-desktop:
    # Desktop runtime integration suite (npm test) on its own job, separate
    # from test-windows. The suite is self-contained: it needs only a
    # checkout, Node 22, root npm dependencies, and a Python interpreter on
    # PATH (some desktop tests execute `python -c` snippets through
    # tests/helpers/python-executable.js); it consumes no artifact from the
    # pytest, cargo, or frontend steps of test-windows, and in the old
    # single-job layout it ran BEFORE the frontend build and cargo steps,
    # so it depends on neither. The audit:prod check stays in test-windows,
    # where it still gates the run. This job must stay separate: a pytest
    # failure in test-windows must not be able to skip the desktop suite
    # again. Gate strictness is unchanged — the run conclusion still
    # requires every job green; only the evidence is decoupled. The test
    # log is uploaded on failure so the suite's verdict (including the
    # individual Node test names) is preserved beyond the job log.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      # Same long-path reason as test-windows: archived .coding-tools report
      # overlays exceed legacy Windows MAX_PATH under the runner work dir.
      - name: Allow long paths for checkout
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - name: Verify checkout identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: resources/coding-tools-mcp/pyproject.toml
      - name: Install Coding Tools MCP test dependencies
        run: python -m pip install -e "resources/coding-tools-mcp[dev]"
      - name: Install desktop dependencies
        run: npm ci
      - name: Test desktop runtime integration
        shell: pwsh
        run: |
          npm test 2>&1 | Tee-Object -FilePath desktop-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload desktop test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-log-${{ github.sha }}
          path: desktop-test.log
          if-no-files-found: ignore
          retention-days: 3

  test-windows-smoke:
    # Windows artifact -> npm install smoke on a FRESH checkout, separate
    # from test-windows. The smoke script proves exact source
    # (-RequireExactSource: clean worktree at start and end, source identity
    # pinned to HEAD, staging from `git archive HEAD`, outputs outside the
    # repo), so it consumes no artifact from any earlier step and needs no
    # test step before it. It must stay a separate job: running it after the
    # test-windows suite in one worktree fails by design, because the suite
    # dirties the tree (tracked runtime churn + untracked task-context files)
    # before the smoke's clean-worktree check. The provenance upload moves
    # with the smoke into this job because it reads the file from this job's
    # own $RUNNER_TEMP.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      # Same long-path reason as test-windows: archived .coding-tools report
      # overlays exceed legacy Windows MAX_PATH under the runner work dir.
      - name: Allow long paths for checkout
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - name: Verify checkout identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Do not reuse stale workspace test executables across revisions.
          cache-targets: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Windows artifact to npm install smoke
        # Builds the three Windows binaries, packages the win32-x64 artifact
        # with the native PowerShell script, installs it through the npm
        # installer into a temporary prefix, and verifies the wrapper plus
        # --version/--help and the failure-preserves-old-binaries path. Never
        # touches the npm registry.
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/npm_install_windows_smoke.ps1 -RequireExactSource -ProvenanceOut "$env:RUNNER_TEMP\windows-release-provenance.json"
      - name: Upload Windows exact-source provenance
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-provenance-${{ github.sha }}
          path: ${{ runner.temp }}/windows-release-provenance.json
          if-no-files-found: error
          retention-days: 7
