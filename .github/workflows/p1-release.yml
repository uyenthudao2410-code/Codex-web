name: P1 Release Boundary

on:
  workflow_dispatch:
  push:
    branches: [p1-release-boundary]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-release-boundary:
    name: Windows exact-source release boundary
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Verify exact checkout identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:GITHUB_SHA) { throw "checkout SHA mismatch: $head != $env:GITHUB_SHA" }
          if (git status --porcelain) { throw 'release gate requires a clean checkout' }

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: resources/coding-tools-mcp/pyproject.toml

      - name: Install desktop and Coding Tools MCP dependencies
        shell: pwsh
        run: |
          npm ci
          python -m pip install -e "resources/coding-tools-mcp[dev]"

      - name: Verify production dependency audit
        run: npm run audit:prod -- --audit-level=high

      - name: Run desktop source tests
        run: npm test

      - name: Run Recovery Host process fault matrix
        run: npm run test:recovery:e2e

      - name: Verify Recovery Supervisor logon registration boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $PWD 'resources\recovery-supervisor\recovery-supervisor.ps1'
          try {
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $script -Action Install -AppRoot $PWD
            if ($LASTEXITCODE -ne 0) { throw 'Recovery Supervisor install failed' }
            $task = Get-ScheduledTask -TaskName 'WebMCP Recovery Supervisor' -ErrorAction Stop
            $logonTriggers = @($task.Triggers | Where-Object { $_.CimClass.CimClassName -eq 'MSFT_TaskLogonTrigger' })
            if ($logonTriggers.Count -lt 1) { throw 'Recovery Supervisor is missing its Windows logon trigger' }
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $script -Action Status
            if ($LASTEXITCODE -ne 0) { throw 'Recovery Supervisor status failed after install' }
          } finally {
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $script -Action Uninstall 2>$null
          }

      - name: Build exact-source Server and Runner canary binaries
        shell: pwsh
        run: |
          cargo build --locked -p webcodex --bin webcodex-server
          if ($LASTEXITCODE -ne 0) { throw 'webcodex-server build failed' }
          cargo build --locked -p webcodex-runner --bin webcodex-runner
          if ($LASTEXITCODE -ne 0) { throw 'webcodex-runner build failed' }

      - name: Run Server-First SourceSnapshot syntax gate
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\e2e_server_first_snapshot_ws.ps1 -SyntaxOnly

      - name: Run Server-First SourceSnapshot real-process canary
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\e2e_server_first_snapshot_ws.ps1

      - name: Build Windows NSIS package from exact source
        run: npm run dist

      - name: Record P1 release provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem -Path dist -File -Filter 'web-mcp-assistant-setup-*.exe' |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if ($null -eq $installer) { throw 'NSIS installer was not produced' }
          $package = Get-Content -Raw package.json | ConvertFrom-Json
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          New-Item -ItemType Directory -Force -Path release-proof | Out-Null
          [ordered]@{
            schema_version = 1
            p1_release_boundary = 'passed'
            git_sha = $env:GITHUB_SHA
            git_ref = $env:GITHUB_REF
            github_run_id = $env:GITHUB_RUN_ID
            github_run_attempt = $env:GITHUB_RUN_ATTEMPT
            package_version = [string]$package.version
            installer_name = $installer.Name
            installer_size_bytes = [int64]$installer.Length
            installer_sha256 = $hash
            exact_source_checkout = 'passed'
            recovery_process_fault_matrix = 'passed'
            recovery_supervisor_logon_registration = 'passed'
            server_first_source_snapshot_canary = 'passed'
            nsis_packaging = 'passed'
            generated_at_utc = [DateTimeOffset]::UtcNow.ToString('o')
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath release-proof\p1-release-provenance.json -Encoding utf8NoBOM
          Get-Content -Raw release-proof\p1-release-provenance.json

      - name: Upload P1 release proof
        uses: actions/upload-artifact@v4
        with:
          name: p1-release-proof-${{ github.sha }}
          path: |
            release-proof/p1-release-provenance.json
            dist/web-mcp-assistant-setup-*.exe
            dist/latest.yml
          if-no-files-found: error
          retention-days: 14
